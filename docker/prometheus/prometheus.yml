# Collecte des métriques de Lumen (docker compose --profile observability up).
# Le jeton est le même que LUMEN_METRICS_TOKEN, transmis en secret Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: lumen
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /run/secrets/lumen_metrics_token
    static_configs:
      - targets: ['lumen:8090']
