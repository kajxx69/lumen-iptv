services:
  # Backend Lumen. Secrets dans un fichier .env à côté de ce fichier (jamais commité) :
  #   LUMEN_MASTER_KEY=<openssl rand -base64 32>
  #   LUMEN_ADMIN_PASSWORD=<au moins 10 caractères>
  lumen:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    image: lumen/server:dev
    ports:
      - '8090:8090'
    environment:
      LUMEN_MASTER_KEY: ${LUMEN_MASTER_KEY:?définir LUMEN_MASTER_KEY dans .env}
      LUMEN_ADMIN_PASSWORD: ${LUMEN_ADMIN_PASSWORD:-}
      # Accès en HTTP simple sur le réseau local ; à retirer derrière un reverse proxy HTTPS.
      LUMEN_COOKIE_SECURE: 'false'
      # Optionnel : active /metrics pour Prometheus (profil observability).
      LUMEN_METRICS_TOKEN: ${LUMEN_METRICS_TOKEN:-}
    volumes:
      - lumen-data:/data

  fake-portal:
    build:
      context: .
      dockerfile: docker/fake-portal.Dockerfile
    image: lumen/fake-portal:dev
    ports:
      - '8080:8080'
    environment:
      FAKE_PORTAL_NAME: Lumen Fake Portal A
      FAKE_PORTAL_LOG_LEVEL: info

  # Second portail pour les tests d'agrégation (phase 6) :
  # docker compose --profile multi up
  fake-portal-b:
    profiles: ['multi']
    image: lumen/fake-portal:dev
    depends_on:
      - fake-portal
    ports:
      - '8081:8080'
    environment:
      FAKE_PORTAL_NAME: Lumen Fake Portal B
      FAKE_PORTAL_SEED: '2'
      FAKE_PORTAL_NAMING_STYLE: plain
      FAKE_PORTAL_LOG_LEVEL: info

  # Observabilité : docker compose --profile observability up
  # Exige LUMEN_METRICS_TOKEN (16 caractères au moins) dans .env.
  prometheus:
    profiles: ['observability']
    image: prom/prometheus:v3.5.0
    depends_on:
      - lumen
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets:
      - lumen_metrics_token

  grafana:
    profiles: ['observability']
    image: grafana/grafana-oss:12.1.1
    depends_on:
      - prometheus
    ports:
      - '3000:3000'
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

secrets:
  lumen_metrics_token:
    environment: LUMEN_METRICS_TOKEN

volumes:
  lumen-data:
  prometheus-data:
  grafana-data:
